# golangci-lint configuration.
#
# Before this file existed the run used golangci-lint's built-in defaults,
# including max-issues-per-linter: 50 and max-same-issues: 3. That silently
# truncated the report to 144 findings when the real total was 764, so the
# output could not be used to tell whether a change made things better or
# worse. Both caps are lifted below.

run:
  timeout: 5m

linters:
  # Pinned rather than inherited so the set is visible in review. These are
  # exactly golangci-lint v1's defaults — nothing has been dropped.
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  # Report everything. See the note above.
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # errcheck is off in tests, on everywhere else.
    #
    # A test that ignores an error still fails: the assertion that follows
    # sees the missing file, the empty response, the unwritten row. The 572
    # findings this suppressed were overwhelmingly json.Encoder.Encode inside
    # httptest handlers writing canned responses, plus os.WriteFile/MkdirAll
    # building fixtures — call sites where `_ =` adds noise and no safety.
    #
    # Production code gets no such exemption; every unchecked error there is
    # either handled or explicitly ignored with a comment saying why.
    - path: _test\.go
      linters:
        - errcheck
