openapi: 3.1.0
info:
  title: Brain public API
  version: 1.0.0
  description: >-
    Supported single-mode HTTP contract. Tenant selection never grants
    authority. Script execution is not exposed by this contract checkpoint.
    Existing error bodies are retained; SDK adapters add stable codes and
    request identifiers.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
x-brain-read:
  x-brain-effect: read
  x-brain-script: false
  x-brain-profile: single
x-brain-write:
  x-brain-effect: write
  x-brain-script: false
  x-brain-profile: single
paths:
  /health:
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: health.get
      summary: Get server health
      security: []
      responses:
        '200':
          description: Server health (not script availability)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /entries:
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: entries.list
      summary: List entries
      parameters:
        - name: project
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: tags
          in: query
          schema:
            type: string
        - name: feature_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
        - name: global
          in: query
          schema:
            type: boolean
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortOrder
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A page of entries; truncated is not end-of-pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEntriesResponse'
    post:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: entries.create
      summary: Create an entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntryRequest'
      responses:
        '201':
          description: Persisted entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEntryResponse'
  /entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: entries.get
      summary: Get an entry by ID or legacy path
      responses:
        '200':
          description: Entry, including current revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrainEntry'
    patch:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: entries.update
      summary: Update an entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEntryRequest'
      responses:
        '200':
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrainEntry'
    delete:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: entries.delete
      summary: Delete a confirmed entry
      parameters:
        - name: confirm
          in: query
          required: true
          schema:
            type: boolean
            const: true
        - name: force
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Entry deleted; no response body
  /search:
    post:
      x-brain-effect: provider
      x-brain-script: false
      x-brain-profile: single
      operationId: search.query
      summary: Search visible entries
      description: >-
        Semantic/hybrid strategy may call an embedding provider; not a safe
        dry-run read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Matching entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
  /tasks/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: tasks.list
      summary: List resolved project tasks
      responses:
        '200':
          description: Resolved tasks and dependencies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
  /tasks/{projectId}/{taskId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: tasks.get
      summary: Get a resolved task
      responses:
        '200':
          description: Resolved task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedTask'
  /entries/{id}/move:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: entries.move
      summary: Move an entry between projects
      x-brain-effect: write
      x-brain-profile: single
      x-brain-script: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveEntryRequest'
      responses:
        '200':
          description: Move result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResult'
  /entries/bulk-update:
    post:
      operationId: entries.bulkUpdate
      summary: Update a bounded set of entries
      x-brain-effect: write
      x-brain-profile: single
      x-brain-script: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateRequest'
      responses:
        '200':
          description: Per-entry outcomes; inspect failed and truncated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateResponse'
  /entries/bulk-delete:
    post:
      operationId: entries.bulkDelete
      summary: Delete a bounded set of entries
      x-brain-effect: write
      x-brain-profile: single
      x-brain-script: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteRequest'
      responses:
        '200':
          description: Per-entry outcomes; inspect failed and truncated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteResponse'
  /entries/{id}/sections:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: sections.list
      summary: List section headings
      x-brain-effect: read
      x-brain-profile: single
      x-brain-script: false
      responses:
        '200':
          description: Section headings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionsResponse'
  /entries/{id}/sections/{title}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: title
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: sections.get
      summary: Get a section by heading title
      x-brain-effect: read
      x-brain-profile: single
      x-brain-script: false
      parameters:
        - name: includeSubsections
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Section content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionContentResponse'
  /entries/{id}/backlinks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: graph.backlinks
      summary: Get entries linking to this entry
      x-brain-effect: read
      x-brain-profile: single
      x-brain-script: false
      responses:
        '200':
          description: Entry array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrainEntry'
  /entries/{id}/outlinks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: graph.outlinks
      summary: Get entries linked from this entry
      x-brain-effect: read
      x-brain-profile: single
      x-brain-script: false
      responses:
        '200':
          description: Entry array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrainEntry'
  /entries/{id}/related:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: graph.related
      summary: Get related entries
      x-brain-effect: read
      x-brain-profile: single
      x-brain-script: false
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Entry array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrainEntry'
  /attachments:
    get:
      operationId: attachments.list
      summary: List project attachment metadata
      x-brain-effect: read
      x-brain-profile: single
      x-brain-script: false
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attachment metadata list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAttachmentsResponse'
    post:
      operationId: attachments.upload
      summary: Upload attachment bytes without local path interpretation
      x-brain-effect: write
      x-brain-profile: single
      x-brain-script: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - project_id
                - file
              properties:
                project_id:
                  type: string
                metadata:
                  type: string
                  description: JSON-encoded object with string values
                file:
                  type: string
                  format: binary
                  x-go-type: '[]byte'
      responses:
        '201':
          description: Stored attachment metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAttachmentResponse'
  /attachments/{attachmentID}:
    parameters:
      - name: attachmentID
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: attachments.get
      summary: Get project attachment metadata
      x-brain-effect: read
      x-brain-profile: single
      x-brain-script: false
      responses:
        '200':
          description: Attachment metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
    delete:
      operationId: attachments.delete
      summary: Delete an unreferenced attachment
      x-brain-effect: write
      x-brain-profile: single
      x-brain-script: false
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDeletionResponse'
  /attachments/{attachmentID}/content:
    parameters:
      - name: attachmentID
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: attachments.download
      summary: Download bounded attachment bytes
      x-brain-effect: read
      x-brain-profile: single
      x-brain-script: false
      responses:
        '200':
          description: Raw content; actual media type follows stored metadata
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                x-go-type: '[]byte'
  /attachments/{attachmentID}/text:
    parameters:
      - name: attachmentID
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: attachments.text
      summary: Download already-extracted text without invoking extraction
      x-brain-effect: read
      x-brain-profile: single
      x-brain-script: false
      responses:
        '200':
          description: Stored derived text
          content:
            text/plain:
              schema:
                type: string
  /attachments/{attachmentID}/extract:
    parameters:
      - name: attachmentID
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: query
        required: true
        schema:
          type: string
    post:
      operationId: attachments.extract
      summary: Run extraction and persist derived text
      x-brain-effect: provider
      x-brain-profile: single
      x-brain-script: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentExtractionRequest'
      responses:
        '200':
          description: Derived text and linked-entry outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentExtractionResult'
  /entries/{id}/attachments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: attachments.forEntry
      summary: List entry attachment references
      x-brain-effect: read
      x-brain-profile: single
      x-brain-script: false
      responses:
        '200':
          description: Entry references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachEntryAttachmentResponse'
    post:
      operationId: attachments.attach
      summary: Attach an existing project attachment to an entry
      description: attachment.role must be non-empty; metadata DTO omission does not waive service validation.
      x-brain-effect: write
      x-brain-profile: single
      x-brain-script: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachEntryAttachmentRequest'
      responses:
        '200':
          description: Updated entry references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachEntryAttachmentResponse'
  /entries/{id}/attachments/{attachmentID}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: attachmentID
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: query
        required: true
        schema:
          type: string
    delete:
      operationId: attachments.detach
      summary: Remove an attachment reference from an entry
      x-brain-effect: write
      x-brain-profile: single
      x-brain-script: false
      parameters:
        - name: role
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Updated entry references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachEntryAttachmentResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    AttachmentDeletionResponse:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: boolean
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - embedding
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        embedding:
          $ref: '#/components/schemas/EmbeddingHealthStatus'
    EmbeddingHealthStatus:
      type: object
      required:
        - enabled
        - status
      properties:
        enabled:
          type: boolean
        status:
          type: string
        provider:
          type: string
        model:
          type: string
    AttachmentDerived:
      properties:
        content_type:
          type: string
        created:
          type: string
        id:
          type: string
        kind:
          type: string
        size:
          format: int64
          type: integer
        storage_key:
          type: string
      required:
        - id
        - kind
      type: object
    AttachmentDerivedText:
      properties:
        content_type:
          type: string
        created:
          type: string
        error:
          type: string
        id:
          type: string
        kind:
          type: string
        metadata:
          anyOf:
            - additionalProperties:
                type: string
              type: object
            - type: 'null'
        modified:
          type: string
        status:
          type: string
        text:
          type: string
      required:
        - status
      type: object
    AttachmentReference:
      properties:
        caption:
          type: string
        content_type:
          type: string
        derived:
          anyOf:
            - items:
                $ref: '#/components/schemas/AttachmentDerived'
              type: array
            - type: 'null'
        derived_text:
          anyOf:
            - $ref: '#/components/schemas/AttachmentDerivedText'
            - type: 'null'
        download_url:
          type: string
        filename:
          type: string
        id:
          type: string
        metadata:
          anyOf:
            - additionalProperties:
                type: string
              type: object
            - type: 'null'
        role:
          type: string
        sha256:
          type: string
        size:
          format: int64
          type: integer
        text_url:
          type: string
      required:
        - id
      type: object
    AutomationAction:
      properties:
        agent:
          type: string
        command:
          type: string
        complete_on_idle:
          anyOf:
            - type: boolean
            - type: 'null'
        direct_prompt:
          type: string
        execution_mode:
          type: string
        executor:
          type: string
        model:
          type: string
        requires_capability:
          type: string
        session_mode:
          type: string
        set_status:
          type: string
        target_workdir:
          type: string
        timeout:
          type: string
        type:
          type: string
      required:
        - type
      type: object
    AutomationRetry:
      properties:
        backoff:
          type: string
        delay:
          type: string
        max_attempts:
          type: integer
      type: object
    BacklinkEntry:
      properties:
        id:
          type: string
        path:
          type: string
        title:
          type: string
        type:
          type: string
      required:
        - id
        - path
        - title
        - type
      type: object
    BrainEntry:
      properties:
        access_count:
          type: integer
        action:
          anyOf:
            - $ref: '#/components/schemas/AutomationAction'
            - type: 'null'
        agent:
          type: string
        attachments:
          anyOf:
            - items:
                $ref: '#/components/schemas/AttachmentReference'
              type: array
            - type: 'null'
        attempt_count:
          type: integer
        automation_run_id:
          type: string
        backlinks:
          anyOf:
            - items:
                $ref: '#/components/schemas/BacklinkEntry'
              type: array
            - type: 'null'
        checkout_mode:
          type: string
        complete_on_idle:
          anyOf:
            - type: boolean
            - type: 'null'
        completed_at:
          type: string
        content:
          type: string
        created:
          type: string
        delivery_mode:
          type: string
        delivery_verification:
          anyOf:
            - $ref: '#/components/schemas/DeliveryVerification'
            - type: 'null'
        depends_on:
          anyOf:
            - items:
                type: string
              type: array
            - type: 'null'
        direct_prompt:
          type: string
        embedding_status:
          type: string
        execution_mode:
          type: string
        executor:
          type: string
        expires_at:
          type: string
        extensions:
          anyOf:
            - items:
                type: string
              type: array
            - type: 'null'
        feature_depends_on:
          anyOf:
            - items:
                type: string
              type: array
            - type: 'null'
        feature_expires_at:
          type: string
        feature_id:
          type: string
        feature_priority:
          type: string
        feature_run_once_at:
          type: string
        feature_schedule:
          type: string
        feature_starts_at:
          type: string
        feature_timezone:
          type: string
        generated:
          anyOf:
            - type: boolean
            - type: 'null'
        generated_by:
          type: string
        generated_key:
          type: string
        generated_kind:
          type: string
        git_branch:
          type: string
        git_remote:
          type: string
        goal:
          anyOf:
            - $ref: '#/components/schemas/GoalConfig'
            - type: 'null'
        id:
          type: string
        last_failed_at:
          type: string
        last_verified:
          type: string
        machine_affinity:
          type: string
        max_runs:
          anyOf:
            - type: integer
            - type: 'null'
        merge_policy:
          type: string
        merge_strategy:
          type: string
        merge_target_branch:
          type: string
        model:
          type: string
        modified:
          type: string
        next_run:
          type: string
        open_pr_before_merge:
          anyOf:
            - type: boolean
            - type: 'null'
        origin_client_id:
          type: string
        origin_machine_id:
          type: string
        origin_path:
          type: string
        parent_id:
          type: string
        path:
          type: string
        priority:
          type: string
        project_id:
          type: string
        reminder:
          anyOf:
            - $ref: '#/components/schemas/ReminderConfig'
            - type: 'null'
        remote_branch_policy:
          type: string
        requires_capability:
          anyOf:
            - items:
                type: string
              type: array
            - type: 'null'
        resume_executor_override:
          type: string
        resume_injected_context:
          type: string
        resume_mode:
          type: string
        resume_prefer_same_session:
          type: boolean
        resume_requested:
          type: boolean
        resume_requested_at:
          type: string
        retry:
          anyOf:
            - $ref: '#/components/schemas/AutomationRetry'
            - type: 'null'
        revision:
          type: string
        run_finalizations:
          anyOf:
            - additionalProperties:
                $ref: '#/components/schemas/RunFinalization'
              type: object
            - type: 'null'
        run_once_at:
          type: string
        runs:
          anyOf:
            - items:
                $ref: '#/components/schemas/CronRun'
              type: array
            - type: 'null'
        schedule:
          type: string
        schedule_enabled:
          anyOf:
            - type: boolean
            - type: 'null'
        session_mode:
          type: string
        sessions:
          anyOf:
            - additionalProperties:
                $ref: '#/components/schemas/SessionInfo'
              type: object
            - type: 'null'
        starts_at:
          type: string
        status:
          type: string
        tags:
          anyOf:
            - items:
                type: string
              type: array
            - type: 'null'
        target_workdir:
          type: string
        timezone:
          type: string
        title:
          type: string
        trigger:
          anyOf:
            - $ref: '#/components/schemas/TriggerConfig'
            - type: 'null'
        type:
          type: string
        user_original_request:
          type: string
        workdir:
          type: string
      required:
        - id
        - path
        - title
        - type
        - status
        - content
        - tags
      type: object
    CreateEntryRequest:
      properties:
        action:
          anyOf:
            - $ref: '#/components/schemas/AutomationAction'
            - type: 'null'
        agent:
          type: string
        assignment_intent:
          type: string
        attachments:
          anyOf:
