# Descriptive audit inventory, NOT an authorization registry or script allowlist.
# Public request/response shapes remain exclusively in openapi.yaml.
version: 1
profile: single
script_exposure: false
dry_run_validator: unimplemented
inherited_request_telemetry: unreviewed
evidence: docs/sdk-operation-matrix.md
# Each row: [legacy router scope, required future resource/action checks,
#            revision/precondition contract, conservative real effects, provider]
# none on a precondition means no revision guarantee, NOT unconditional authority.
# Content may create runnable tasks/automations; never infer work/spend permission.
# Provider column: "+"-joined tokens from a closed set, pinned and derived from
# internal/service by internal/sdkcontract/policy_provider_test.go:
#   embedding_sync        indexEmbeddingsForEntry / IndexEmbeddings* / embedding Embed
#                         (Save, and Update via the feature-schedule gate)
#   embedding_background  scheduleEmbeddingRefresh (body/attachment changes)
#   web_push              phonepush Enqueue: attention.created -> AttentionDispatcher,
#                         and the 10s push poller for fired reminders (StartPush)
# "Triggered" includes later background work driven by the operation's state:
# reminder create/update/snooze are fired by the scheduler (embedding + push);
# goal create/update drive the goal ticker. These three tokens are DERIVED from a
# conservative call graph over internal/api + internal/service
# (policy_provider/egress_routes tests); reminders.ack is the one reviewed
# flow-sensitive exception (status-only update).
#   webhook_http / extraction_provider / external_delivery_verification: direct calls
#   downstream_*          may cause runnable work whose executor reaches providers
# Every event-emitting operation may additionally reach subscribed webhooks and
# event-triggered automations; that cross-cutting fan-out is declared once here.
event_fanout: [webhook_http_for_subscribed_events, event_triggered_automations]
