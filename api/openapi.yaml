openapi: 3.1.0
info:
  title: Brain public API
  version: 1.0.0
  description: >-
    Supported single-mode HTTP contract. Tenant selection never grants
    authority. Script execution is not exposed by this contract checkpoint.
    Existing error bodies are retained; SDK adapters add stable codes and
    request identifiers.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
x-brain-read:
  x-brain-effect: read
  x-brain-script: false
  x-brain-profile: single
x-brain-write:
  x-brain-effect: write
  x-brain-script: false
  x-brain-profile: single
paths:
  /events/stream:
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: events.stream
      summary: Consume the bounded event stream without automatic reconnect
      description: SSE data is an Event JSON object. Comments are heartbeats. Last-Event-ID requests best-effort replay from the volatile buffer, not a durable cursor or exactly-once delivery. SDK client lifetime, caller cancellation and timeout terminate the stream; callback return errors stop delivery. Bounds apply per frame, not to the total stream lifetime.
      parameters:
        - {name: project_id, in: query, schema: {type: string}}
        - {name: feature_id, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string}}
        - {name: source, in: query, schema: {type: string}}
        - {name: Last-Event-ID, in: header, schema: {type: string}}
      responses:
        '200': {description: SSE frames carrying Event JSON data, content: {text/event-stream: {schema: {type: string}}}}
        default: {description: Legacy error before stream starts, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /entries/{id}/metadata:
    patch:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: entries.updateMetadata
      summary: Update explicitly allowed durable and runtime metadata
      description: expected_revision is a precondition and is not persisted. Durable fields sync to Markdown; runtime/audit fields remain index-only. Unknown fields return 400 with field details. Runnable metadata may affect work; not script-exposed.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MetadataUpdateRequest'}}}}
      responses:
        '200': {description: Updated entry, content: {application/json: {schema: {$ref: '#/components/schemas/BrainEntry'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /inject:
    post:
      x-brain-effect: provider
      x-brain-script: false
      x-brain-profile: single
      operationId: search.inject
      summary: Retrieve bounded context for a query
      description: Preserves legacy search/provider and read-tracking behavior; not a side-effect-free script read.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InjectRequest'}}}}
      responses:
        '200': {description: Context and source entries, content: {application/json: {schema: {$ref: '#/components/schemas/InjectResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/{taskId}/delivery:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: taskId, in: path, required: true, schema: {type: string}}
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: tasks.delivery
      summary: Read delivery verification independently of implementation status
      responses:
        '200': {description: Delivery state and unmet requirements, content: {application/json: {schema: {$ref: '#/components/schemas/TaskDeliveryResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
    post:
      x-brain-effect: provider
      x-brain-script: false
      x-brain-profile: single
      operationId: tasks.verifyDelivery
      summary: Configure or verify delivery with revision precondition
      description: Configure and integration update state; verify may call GitHub. Provider failure can still return 200 with verification_error and invalidated evidence. No merge or deployment occurs here.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryCommand'}}}}
      responses:
        '200': {description: Updated delivery and unmet requirements, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryUpdateResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /events/recent:
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: events.recent
      summary: Read filtered recent event buffer and coverage
      description: Volatile buffer, not a durable complete audit. Positive limit defaults to 100 and is capped at 1000.
      parameters:
        - {name: project_id, in: query, schema: {type: string}}
        - {name: feature_id, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string}}
        - {name: source, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
      responses:
        '200': {description: Recent events, content: {application/json: {schema: {$ref: '#/components/schemas/RecentEventsResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /events/wait:
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: events.wait
      summary: Wait for a bounded event page using caller-bound opaque cursor
      description: Cursor binds caller and exact filters. Omitted timeout_ms is 25000; zero polls immediately. No automatic retry. Events are server-redacted; cursor_expired and truncated require explicit caller handling.
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string}}
        - {name: feature_id, in: query, schema: {type: string}}
        - {name: task_id, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string}}
        - {name: source, in: query, schema: {type: string}}
        - {name: after, in: query, schema: {type: string}}
        - {name: timeout_ms, in: query, schema: {type: integer, minimum: 0, maximum: 25000}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Event page or timeout/shutdown outcome, content: {application/json: {schema: {$ref: '#/components/schemas/EventWaitResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /events/resource-health:
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: events.resourceHealth
      summary: Read recent runner resource samples
      description: Null measurements mean unavailable, not zero. An empty list does not establish health. At most 100 unique runner/task samples.
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string}}
        - {name: task_id, in: query, schema: {type: string}}
      responses:
        '200': {description: Samples and coverage limitations, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceHealthResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /timeline:
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: observability.timeline
      summary: Read recorded events and projected schedule occurrences
      description: Projections are not executions. Range must increase and span at most 366 days. Default range is 30 days before and after now.
      parameters:
        - {name: project, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Actual and projected timeline items, content: {application/json: {schema: {$ref: '#/components/schemas/TimelineResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /projects/{projectId}/placement:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: projects.getPlacement
      summary: Read project placement policy (soft default when no row exists)
      responses:
        '200': {description: Placement policy, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectPlacement'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
    put:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: projects.setPlacement
      summary: Replace project placement policy
      description: Changes future work placement; does not dispatch work. Path project overrides the body project_id.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectPlacement'}}}}
      responses:
        '200': {description: Saved policy, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectPlacement'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/{taskId}/resume:
    post:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: tasks.resume
      summary: Request abandoned task resume
      description: Force bypasses abandonment, not live-claim safety. HTTP 200 may be a no-op; inspect resumed and reason. No executor is started by this HTTP handler.
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: taskId, in: path, required: true, schema: {type: string}}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ResumeTaskOptions'}}}}
      responses:
        '200': {description: Resume outcome, content: {application/json: {schema: {$ref: '#/components/schemas/ResumeTaskResult'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/{taskId}/resume-with-context:
    post:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: tasks.resumeWithContext
      summary: Inject context into a live session or request a relaunch
      description: Nonblank injected_context required. Resume mode is advisory until runner resolution. Results may be no-ops. Live injection is effectful.
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: taskId, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResumeWithContextOptions'}}}}
      responses:
        '200': {description: Context resume outcome, content: {application/json: {schema: {$ref: '#/components/schemas/ResumeWithContextResult'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/{taskId}/assignment:
    put:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: tasks.assign
      summary: Assign a task to a registered runner
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: taskId, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskAssignmentRequest'}}}}
      responses:
        '200': {description: Assignment state, content: {application/json: {schema: {$ref: '#/components/schemas/TaskAssignmentResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/{taskId}/assignment/clear:
    post:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: tasks.clearAssignment
      summary: Clear task assignment with explicit intent
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: taskId, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClearFeatureAssignmentRequest'}}}}
      responses:
        '200': {description: Cleared assignment state, content: {application/json: {schema: {$ref: '#/components/schemas/TaskAssignmentResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/{taskId}/trigger:
    post:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: tasks.trigger
      summary: Trigger a task or create its next scheduled run
      description: Inspect triggered and reason; HTTP success does not promise work started.
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: taskId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Trigger result, content: {application/json: {schema: {$ref: '#/components/schemas/TriggerResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/{taskId}/run:
    post:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: tasks.run
      summary: Request immediate scheduler dispatch
      description: HTTP 200 can report dispatched false. Unconfigured scheduler returns 501. No automatic SDK fallback to trigger or retry.
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: taskId, in: path, required: true, schema: {type: string}}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/RunTaskRequest'}}}}
      responses:
        '200': {description: Dispatch outcome, content: {application/json: {schema: {$ref: '#/components/schemas/RunTaskResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/{taskId}/dispatch:
    post:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: tasks.dispatch
      summary: Direct dispatch to a registered eligible runner
      description: Creates a pre-claim and dispatch lease; never retried by SDK. Runner registration and placement are checked by the existing service, not proof of hosted runner ownership. Conflict bodies use success and error, not message.
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: taskId, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DispatchRequest'}}}}
      responses:
        '200': {description: Dispatch lease, content: {application/json: {schema: {$ref: '#/components/schemas/SDKDispatchResponse'}}}}
        '409': {description: Claim conflict, content: {application/json: {schema: {$ref: '#/components/schemas/DispatchConflictResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/{taskId}/logs:
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: tasks.logs
      summary: Read retained in-memory task logs
      description: Omitted offset returns the newest limit lines. Explicit offset zero starts at oldest retained. Empty real task logs do not prove no output before a restart.
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: taskId, in: path, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: offset, in: query, schema: {type: integer}}
      responses:
        '200': {description: Log window, content: {application/json: {schema: {$ref: '#/components/schemas/LogQueryResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/features/{featureId}/resume:
    post:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: features.resume
      summary: Resume feature tasks with per-task outcomes
      description: Partial errors are skipped results, not a failed batch. Results may be truncated while aggregate counts remain complete.
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: featureId, in: path, required: true, schema: {type: string}}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ResumeTaskOptions'}}}}
      responses:
        '200': {description: Batch resume outcome, content: {application/json: {schema: {$ref: '#/components/schemas/ResumeFeatureResult'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/features/{featureId}/resume-with-context:
    post:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: features.resumeWithContext
      summary: Inject context or request relaunch for each feature task
      description: Partial outcomes and truncation mirror feature resume. Live injection is effectful, advisory modes are resolved by runner.
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: featureId, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResumeWithContextOptions'}}}}
      responses:
        '200': {description: Context resume batch, content: {application/json: {schema: {$ref: '#/components/schemas/ResumeWithContextFeatureResult'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/features/{featureId}/assignment:
    put:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: features.assign
      summary: Assign a feature to a registered runner
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: featureId, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FeatureAssignmentRequest'}}}}
      responses:
        '200': {description: Feature assignment, content: {application/json: {schema: {$ref: '#/components/schemas/FeatureAssignmentResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/features/{featureId}/assignment/clear:
    post:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: features.clearAssignment
      summary: Clear feature assignment with explicit clear intent
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: featureId, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClearFeatureAssignmentRequest'}}}}
      responses:
        '200': {description: Cleared feature assignment, content: {application/json: {schema: {$ref: '#/components/schemas/FeatureAssignmentResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/features/{featureId}/checkout:
    post:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: features.checkout
      summary: Create an indexed checkout task
      description: Creates work rather than executing Git synchronously. Unknown body fields rejected. Supply explicit merge_policy to avoid inherited defaults.
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: featureId, in: path, required: true, schema: {type: string}}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/FeatureCheckoutOptions'}}}}
      responses:
        '200': {description: Created or existing checkout task, content: {application/json: {schema: {$ref: '#/components/schemas/CheckoutFeatureResult'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/features/{featureId}/run:
    parameters:
      - {name: projectId, in: path, required: true, schema: {type: string}}
      - {name: featureId, in: path, required: true, schema: {type: string}}
    post:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: features.run
      summary: Request feature dispatch and optional dependent chain
      description: Inspect dispatched and reason. Missing scheduler returns 501. No automatic retry or trigger fallback.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/RunFeatureRequest'}}}}
      responses:
        '200': {description: Per-task dispatch results, content: {application/json: {schema: {$ref: '#/components/schemas/RunFeatureResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
    delete:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: features.cancel
      summary: Cancel future additions to a dependent chain
      description: Already-dispatched tasks continue. This does not cancel running tasks.
      responses:
        '200': {description: Chain cancellation result, content: {application/json: {schema: {$ref: '#/components/schemas/CancelChainResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/chains:
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: features.chains
      summary: List standing dependent chains
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Chains with current derived membership, content: {application/json: {schema: {$ref: '#/components/schemas/DependentChainsResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/run:
    post:
      x-brain-effect: write
      x-brain-script: false
      x-brain-profile: single
      operationId: projects.run
      summary: Dispatch ready project features
      description: Per-feature partial outcomes; absence of eligible runners can be a successful HTTP response with no dispatch.
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/RunProjectRequest'}}}}
      responses:
        '200': {description: Feature dispatch outcomes, content: {application/json: {schema: {$ref: '#/components/schemas/RunProjectResponse'}}}}
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
  /tasks/{projectId}/status:
    post:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: tasks.status
      summary: Read requested task statuses and report unresolved IDs
      description: taskIds must be nonempty. Legacy waitFor and timeout fields are accepted but do not wait.
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MultiTaskStatusRequest'}
      responses:
        '200':
          description: Requested tasks and completion state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MultiTaskStatusResponse'}
        default:
          description: Legacy API error adapted by the SDK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
  /tasks/{projectId}/{taskId}/metadata:
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: tasks.metadata
      summary: Read execution metadata without task title or content
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: taskId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Legacy task execution metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskMetadataResponse'}
        default:
          description: Legacy API error adapted by the SDK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
  /tasks/{projectId}/{taskId}/claim-status:
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: tasks.claimStatus
      summary: Inspect a task claim without acquiring or renewing it
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: taskId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Claim state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClaimStatusResponse'}
        default:
          description: Legacy API error adapted by the SDK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
  /tasks/{projectId}/features:
    get:
      x-brain-effect: read
      x-brain-script: false
      x-brain-profile: single
      operationId: features.list
      summary: List computed feature groups
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Feature groups
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeatureListResponse'}
        default:
          description: Legacy API error adapted by the SDK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegacyErrorResponse'}
