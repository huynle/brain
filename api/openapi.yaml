components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    MetadataUpdateRequest:
      type: object
      additionalProperties: false
      description: Exact metadata endpoint key allowlist. Omitted fields are unchanged. Use ordinary entry update for other frontmatter. Audit/runtime JSON fields preserve server-defined contents.
      properties:
        expected_revision: {type: string}
        status: {type: string}
        priority: {type: string}
        tags: {type: array, items: {type: string}}
        depends_on: {type: array, items: {type: string}}
        title: {type: string}
        feature_id: {type: string}
        feature_priority: {type: string}
        feature_depends_on: {type: array, items: {type: string}}
        note: {type: string}
        append: {type: string}
        starts_at: {type: string}
        expires_at: {type: string}
        run_once_at: {type: string}
        timezone: {type: string}
        automation_run_id: {type: string}
        completed_at: {type: string}
        sessions: {type: object, additionalProperties: {$ref: '#/components/schemas/SessionInfo'}}
        next_run: {type: string}
        schedule: {type: string}
        schedule_enabled: {type: boolean}
        complete_on_idle: {type: boolean}
        direct_prompt: {type: string}
        runs: {type: array, items: {}}
        max_runs: {type: integer}
        last_reconcile: {}
        exit_code: {type: integer}
        script_output: {type: string}
        mr_url: {type: string}
        resume_requested: {type: boolean}
        resume_requested_at: {type: string}
        resume_mode: {type: string}
        resume_injected_context: {type: string}
        resume_prefer_same_session: {type: boolean}
        resume_executor_override: {type: string}
        abandoned_at: {type: string}
        abandoned_reason: {type: string}
        attempt_count: {type: integer}
        last_failed_at: {type: string}
    DeliveryCommand:
      type: object
      additionalProperties: false
      required: [action, expected_revision]
      properties:
        action: {type: string, enum: [configure, verify, integration]}
        expected_revision: {type: integer}
        policy: {$ref: '#/components/schemas/DeliveryVerification'}
        artifact: {type: string}
        passed: {type: boolean}
        evidence_reference: {type: string}
    DeliveryUpdateResponse:
      type: object
      required: [delivery, unmet]
      properties:
        delivery: {anyOf: [{$ref: '#/components/schemas/DeliveryVerification'}, {type: 'null'}]}
        unmet: {anyOf: [{type: array, items: {type: string}}, {type: 'null'}]}
    TaskDeliveryResponse:
      allOf:
        - {$ref: '#/components/schemas/DeliveryUpdateResponse'}
        - type: object
          required: [task_id, implementation_status]
          properties:
            task_id: {type: string}
            implementation_status: {type: string}
    RecentEventsResponse:
      type: object
      required: [events, count, coverage]
      properties:
        events: {anyOf: [{type: array, items: {$ref: '#/components/schemas/Event'}}, {type: 'null'}]}
        count: {type: integer}
        coverage: {$ref: '#/components/schemas/EventCoverage'}
    EventWaitResponse:
      type: object
      required: [events, next_cursor, cursor_expired, timed_out, shutdown, truncated]
      properties:
        events: {type: array, items: {$ref: '#/components/schemas/Event'}}
        next_cursor: {type: string}
        cursor_expired: {type: boolean}
        timed_out: {type: boolean}
        shutdown: {type: boolean}
        truncated: {type: boolean}
    ResourceSample:
      type: object
      required: [sampled_at, rss_bytes, process_count, limit_bytes, last_activity, command_summary, warning]
      properties:
        instance_id: {type: string}
        session_id: {type: string}
        executor: {type: string}
        sampled_at: {type: string, format: date-time}
        rss_bytes: {anyOf: [{type: integer, format: int64}, {type: 'null'}]}
        process_count: {anyOf: [{type: integer}, {type: 'null'}]}
        limit_bytes: {type: integer, format: int64}
        last_activity: {anyOf: [{type: string, format: date-time}, {type: 'null'}]}
        command_summary: {anyOf: [{type: string}, {type: 'null'}]}
        unavailable_reason: {type: string}
        termination_reason: {type: string}
        warning: {type: boolean}
    ResourceObservation:
      type: object
      required: [runner_id, task_id, sample, fresh]
      properties:
        runner_id: {type: string}
        task_id: {type: string}
        feature_id: {type: string}
        sample: {$ref: '#/components/schemas/ResourceSample'}
        fresh: {type: boolean}
    ResourceHealthResponse:
      type: object
      required: [observed_at, samples, truncated, coverage, availability, warning_fraction, clear_fraction]
      properties:
        observed_at: {type: string, format: date-time}
