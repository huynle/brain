name: Go CI

on:
  push:
    branches: [main, feature-go-rewrite]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Unscoped storage historical ratchet
        if: github.event_name == 'pull_request'
        env:
          BRAIN_STORAGE_RATCHET_BASE: ${{ github.event.pull_request.base.sha }}
          GOMAXPROCS: '2'
        run: go test -p 1 ./internal/storage -run '^TestProductionUnscopedStorage(Baseline)?$' -count=1 -v

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o bin/brain ./cmd/brain

      - name: Test
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            export BRAIN_STORAGE_RATCHET_BASE="$PR_BASE_SHA"
          fi
          go test ./... -v -count=1 -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          # The pre-existing lint debt this used to work around is gone (764
          # findings cleared), so the whole tree is gated, not just the diff.
          # Keep it that way: `just lint` is the same command with the same
          # pinned version, so a clean local run means a clean CI run.
          only-new-issues: false
