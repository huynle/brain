        '200':
          description: Snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupervisorSnapshot'}
  /supervision/dispatch-preview:
    get:
      operationId: supervision.dispatchPreview
      summary: Preview whether and where a task would dispatch
      description: Read-only; reserves no capacity and creates no claim. Runner-local configuration is unknown.
      x-brain-effect: read
      x-brain-profile: single
      x-brain-script: false
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string}}
        - {name: task_id, in: query, required: true, schema: {type: string}}
        - {name: manual, in: query, schema: {type: boolean}}
      responses:
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
        '200':
          description: Preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DispatchPreview'}
  /supervision/operations:
    post:
      operationId: supervision.submitOperation
      summary: Submit an idempotent supervisor prompt, contextual resume or trigger
      description: >-
        Admin only. prompt drives an agent in a live session; resume_with_context
        injects into or relaunches a task; trigger runs a task. The same id with
        the same payload replays the durable receipt; a different payload is a
        409. Optional budget reservation and checkpoint handoff are checked
        first. Delivered or accepted is not task completion. Unknown fields are
        refused with 400.
      x-brain-effect: provider
      x-brain-profile: single
      x-brain-script: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupervisorOperationRequest'}
      responses:
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
        '200':
          description: Durable operation receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupervisorOperation'}
  /supervision/operations/{operationId}:
    get:
      operationId: supervision.getOperation
      summary: Read a supervisor operation receipt
      description: Admin only; scoped to the submitting principal. Never resends anything.
      x-brain-effect: read
      x-brain-profile: single
      x-brain-script: false
      parameters:
        - {name: operationId, in: path, required: true, schema: {type: string}}
      responses:
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
        '200':
          description: Operation receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupervisorOperation'}
  /supervision/checkpoints:
    get:
      operationId: supervision.checkpoints
      summary: List a project's checkpoints, or one checkpoint's versions
      description: With id, versions newest first (limit 100). Without id, up to 100 checkpoints after the cursor.
      x-brain-effect: read
      x-brain-profile: single
      x-brain-script: false
      parameters:
        - {name: project, in: query, required: true, schema: {type: string}}
        - {name: id, in: query, schema: {type: string}}
        - {name: after, in: query, schema: {type: string}}
      responses:
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
        '200':
          description: Checkpoints or versions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupervisorCheckpointList'}
    post:
      operationId: supervision.updateCheckpoint
      summary: Request, answer, verify or supersede a checkpoint
      description: Admin only, revision-checked. Answers are evidence for a later handoff, not verification or authorization. Unknown fields are refused with 400.
      x-brain-effect: write
      x-brain-profile: single
      x-brain-script: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupervisorCheckpointCommand'}
      responses:
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
        '200':
          description: Current checkpoint
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupervisorCheckpoint'}
  /supervision/budgets:
    get:
      operationId: supervision.budget
      summary: Read an execution budget and its current window
      description: Units cover admitted work only; executor tokens and cost are unknown (always null).
      x-brain-effect: read
      x-brain-profile: single
      x-brain-script: false
      parameters:
        - {name: project, in: query, required: true, schema: {type: string}}
        - {name: id, in: query, required: true, schema: {type: string}}
      responses:
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
        '200':
          description: Budget and window usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionBudgetStatus'}
    post:
      operationId: supervision.updateBudget
      summary: Configure a budget or reserve, commit or cancel units
      description: Admin only. Configure is revision-checked; reservations gate supervisor operations. Unknown fields are refused with 400.
      x-brain-effect: write
      x-brain-profile: single
      x-brain-script: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecutionBudgetCommand'}
      responses:
        default: {description: Legacy error, content: {application/json: {schema: {$ref: '#/components/schemas/LegacyErrorResponse'}}}}
        '200':
          description: Outcome of the action
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionBudgetResult'}
components:
  securitySchemes:
    bearerAuth:
      type: http
